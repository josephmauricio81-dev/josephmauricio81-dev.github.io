<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKE - ATELIER</title>

<!-- FUENTES -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
/* Estilo básico del carrito y botón ver carrito */
#carrito {
    position: fixed;
    top: 80px;
    right: -400px;
    width: 350px;
    max-height: 80vh;
    overflow-y: auto;
    background: #fff;
    border: 1px solid #ccc;
    padding: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    border-radius: 12px;
    transition: right 0.3s ease;
    z-index: 9999;
}
#carrito.abierto { right: 20px; }
#carrito ul { list-style: none; padding: 0; margin-bottom: 15px; }
#carrito li {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    border-bottom: 1px solid #eee;
    padding-bottom: 5px;
}
#carrito button {
    background: #ff4d4d;
    border: none;
    color: #fff;
    padding: 2px 8px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 12px;
}
#btn-ver-carrito {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #000;
    color: #fff;
    padding: 12px 18px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    font-size: 18px;
    z-index: 9999;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}
#btn-ver-carrito:hover { background-color: #444; }

.cantidad { margin: 10px 0; }
.cantidad input { width: 50px; padding: 5px; margin-left: 5px; }

.tallas ul { display: flex; gap: 5px; padding: 0; list-style: none; }
.tallas li {
    border: 1px solid #ccc;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 5px;
}
.tallas li.seleccionada { background-color: #4CAF50; color: #fff; }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <h1 class="logo">ATELIER</h1>
    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="zapatos.html">Zapatos</a></li>
        <li><a href="mochilas.html">Mochilas</a></li>
        <li><a href="contacto.html">Contacto</a></li>
    </ul>
</nav>

<!-- SECCIÓN DE PRODUCTOS NIKE -->
<section class="marca-productos">
    <h2 class="titulo-marca">Nike</h2>

    <div class="producto-marca">
        <img src="img/nike1.jpg" alt="Nike Air Max">
        <div class="info-producto">
            <h3>Nike Air Max</h3>
            <p class="precio">$120.00</p>
            <div class="tallas">
                <span>Tallas:</span>
                <ul>
                    <li>38</li>
                    <li>39</li>
                    <li>40</li>
                    <li>41</li>
                </ul>
            </div>
            <div class="cantidad">
                <label for="cantidad-nike1">Cantidad:</label>
                <input type="number" id="cantidad-nike1" min="1" value="1">
            </div>
            <a href="#" class="btn-agregar">Agregar al carrito</a>
        </div>
    </div>

    <div class="producto-marca">
        <img src="img/nike2.jpg" alt="Nike Revolution">
        <div class="info-producto">
            <h3>Nike Revolution</h3>
            <p class="precio">$90.00</p>
            <div class="tallas">
                <span>Tallas:</span>
                <ul>
                    <li>38</li>
                    <li>39</li>
                    <li>40</li>
                    <li>41</li>
                    <li>42</li>
                </ul>
            </div>
            <div class="cantidad">
                <label for="cantidad-nike2">Cantidad:</label>
                <input type="number" id="cantidad-nike2" min="1" value="1">
            </div>
            <a href="#" class="btn-agregar">Agregar al carrito</a>
        </div>
    </div>
</section>

<!-- BOTÓN VER CARRITO -->
<button id="btn-ver-carrito">🛒 Ver Carrito</button>

<!-- CARRITO -->
<div id="carrito">
    <h2>Tu Carrito</h2>
    <ul id="lista-carrito"></ul>
    <p class="total">Total: $<span id="total">0</span></p>
    <button id="vaciar-carrito">Vaciar carrito</button>
</div>

<footer>
<p>© 2026 ATELIER</p>
</footer>

<script>
const botones = document.querySelectorAll('.btn-agregar');
const carrito = document.getElementById('carrito');
const listaCarrito = document.getElementById('lista-carrito');
const totalSpan = document.getElementById('total');
const vaciarCarritoBtn = document.getElementById('vaciar-carrito');
const btnVerCarrito = document.getElementById('btn-ver-carrito');

let carritoProductos = JSON.parse(localStorage.getItem('carrito')) || [];

// Función para actualizar carrito
function actualizarCarrito() {
    listaCarrito.innerHTML = '';
    let total = 0;
    carritoProductos.forEach((prod, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
            ${prod.nombre} - Talla: ${prod.talla} - $${prod.precio} x ${prod.cantidad} = $${(prod.precio*prod.cantidad).toFixed(2)}
            <button onclick="eliminarProducto(${index})">x</button>
        `;
        listaCarrito.appendChild(li);
        total += prod.precio * prod.cantidad;
    });
    totalSpan.textContent = total.toFixed(2);

    // Guardar en localStorage
    localStorage.setItem('carrito', JSON.stringify(carritoProductos));
}

// Función para eliminar producto
function eliminarProducto(index) {
    carritoProductos.splice(index, 1);
    actualizarCarrito();
}

// Abrir / cerrar carrito
btnVerCarrito.addEventListener('click', () => {
    carrito.classList.toggle('abierto');
});

// Vaciar carrito
vaciarCarritoBtn.addEventListener('click', () => {
    carritoProductos = [];
    actualizarCarrito();
});

// Manejar selección de tallas
document.querySelectorAll('.tallas ul').forEach(ul => {
    ul.querySelectorAll('li').forEach(li => {
        li.addEventListener('click', () => {
            ul.querySelectorAll('li').forEach(item => item.classList.remove('seleccionada'));
            li.classList.add('seleccionada');
        });
    });
});

// Agregar producto al carrito
botones.forEach((boton) => {
    boton.addEventListener('click', function(e) {
        e.preventDefault();
        const productoElem = this.closest('.producto-marca');
        const nombre = productoElem.querySelector('h3').textContent;
        const precioText = productoElem.querySelector('.precio').textContent.replace('$','');
        const precio = parseFloat(precioText);

        // Cantidad
        const cantidadInput = productoElem.querySelector('input[type="number"]');
        let cantidad = parseInt(cantidadInput.value);
        if(cantidad < 1) cantidad = 1;

        // Talla seleccionada
        const tallaSel = productoElem.querySelector('.tallas li.seleccionada');
        if(!tallaSel) {
            alert('Selecciona una talla antes de agregar al carrito');
            return;
        }
        const talla = tallaSel.textContent;

        // Revisar si ya existe el mismo producto con la misma talla
        const existe = carritoProductos.find(prod => prod.nombre === nombre && prod.talla === talla);
        if(existe) {
            existe.cantidad += cantidad;
        } else {
            carritoProductos.push({nombre, precio, cantidad, talla});
        }

        actualizarCarrito();
        carrito.classList.add('abierto');
    });
});

// Inicializar carrito al cargar la página
actualizarCarrito();
</script>

</body>
</html>
